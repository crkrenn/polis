services:
  server:
    environment:
      - TAG=dev
    build:
      target: dev
      args:
        NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "${API_SERVER_PORT:-5000}:${API_SERVER_PORT:-5000}"
      - "9229:9229"

  math:
    environment:
      - TAG=dev
    volumes:
      - ./math:/app
    ports:
      - "18975:18975"
    environment:
      CHOKIDAR_USEPOLLING: "true"

  postgres:
    environment:
      - TAG=dev
    restart: "no"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  file-server:
    environment:
      - TAG=dev
    build:
      args:
        NODE_ENV: development
    ports:
      - ${STATIC_FILES_PORT:-8080}:${STATIC_FILES_PORT:-8080}

  maildev:
    environment:
      - TAG=dev
    image: docker.io/maildev/maildev:1.1.1
    labels:
      polis_tag: ${TAG}
    networks:
      - polis-net
    ports:
      - "1080:1080"
      - "1025:1025"
